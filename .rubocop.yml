# Append to (rather than replace) RuboCop's default AllCops/Exclude, so the
# defaults such as vendor/**/* stay excluded. Without this, CI installs gems
# into vendor/bundle (bundler-cache) and RuboCop would lint third-party gems.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "README.md"
    - "vendor/**/*"
    - "gemfiles/vendor/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"

Style/Documentation:
  Enabled: false

# RSpec fixes both names: `have_no_content` is the matcher DSL entry point and
# `does_not_match?` is part of the matcher protocol.
Naming/PredicatePrefix:
  Exclude:
    - "lib/rspec/json_api/matchers.rb"
    - "lib/rspec/json_api/matchers/match_json_schema.rb"

Naming/PredicateMethod:
  Exclude:
    - "lib/rspec/json_api/schema_match.rb"
